<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>EDGE RUN Icon Generator</title></head>
<body style="background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;font-family:monospace;color:#00F0FF">
<canvas id="c" width="512" height="512" style="border:1px solid #00F0FF33;width:256px;height:256px"></canvas>
<div id="status" style="font-size:12px;letter-spacing:2px">GENERATING...</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = 512, H = 512;

// Background
ctx.fillStyle = '#06080D';
ctx.fillRect(0, 0, W, H);

// Radial center glow
const glow = ctx.createRadialGradient(W/2, H*0.45, 10, W/2, H*0.45, 260);
glow.addColorStop(0, 'rgba(0,240,255,0.12)');
glow.addColorStop(1, 'rgba(0,240,255,0)');
ctx.fillStyle = glow;
ctx.fillRect(0, 0, W, H);

// Grid lines
ctx.strokeStyle = 'rgba(0,240,255,0.045)';
ctx.lineWidth = 1;
for (let i = 0; i <= W; i += W/14) {
  ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke();
}

// Lightning bolt path (custom)
ctx.save();
ctx.translate(W/2, H*0.46);
const s = 5.2;
ctx.beginPath();
ctx.moveTo(28*s, -48*s);
ctx.lineTo(-12*s, 6*s);
ctx.lineTo(8*s, 6*s);
ctx.lineTo(-28*s, 48*s);
ctx.lineTo(12*s, -6*s);
ctx.lineTo(-8*s, -6*s);
ctx.closePath();

const boltGrad = ctx.createLinearGradient(0, -48*s, 0, 48*s);
boltGrad.addColorStop(0, '#AAFFFF');
boltGrad.addColorStop(0.4, '#00F0FF');
boltGrad.addColorStop(1, '#007799');
ctx.fillStyle = boltGrad;

ctx.shadowColor = '#00F0FF';
ctx.shadowBlur = 60;
ctx.fill();
ctx.shadowBlur = 100;
ctx.fill();
ctx.restore();

// Scanlines
ctx.shadowBlur = 0;
for (let y = 0; y < H; y += 8) {
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  ctx.fillRect(0, y, W, 4);
}

// Bottom text
ctx.shadowColor = '#00F0FF';
ctx.shadowBlur = 20;
ctx.fillStyle = '#00F0FF';
ctx.font = 'bold 42px "Courier New", monospace';
ctx.textAlign = 'center';
ctx.letterSpacing = '8px';
ctx.fillText('EDGE  RUN', W/2, H*0.9);

// Border glow
ctx.shadowColor = '#00F0FF';
ctx.shadowBlur = 20;
ctx.strokeStyle = 'rgba(0,240,255,0.5)';
ctx.lineWidth = 5;
ctx.strokeRect(6, 6, W-12, H-12);

ctx.shadowBlur = 0;
ctx.strokeStyle = 'rgba(0,240,255,0.15)';
ctx.lineWidth = 2;
ctx.strokeRect(16, 16, W-32, H-32);

// Auto download as icon.png
setTimeout(() => {
  c.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'icon.png';
    a.click();
    document.getElementById('status').textContent = '✓ icon.png DOWNLOADED — Godsang/godSaying/ 에 넣으세요';
  }, 'image/png');
}, 300);
</script>
</body>
</html>
